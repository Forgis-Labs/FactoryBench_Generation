anomaly_detection:
  binary:
    - "Is there an anomaly in {joint_name} between t={t_start}s and t={t_end}s?"
    - "Does {sensor_name} show abnormal behavior during this episode?"
    - "Is the {parameter_name} within normal operating range?"
    - "Is {joint_name} operating normally at t={timestamp}s?"
    - "Are there any unusual patterns in the {sensor_type} data?"
    - "Is the vibration signature normal for {component}?"
    - "Does the temperature profile indicate a fault in {component}?"
    
  open_ended:
    - "Describe any anomalies detected in {joint_name} during this episode."
    - "What abnormal patterns do you observe in the {sensor_type} data?"
    - "List all parameters that are outside their normal operating ranges."
    - "What unusual behavior is present in {joint_name} from t={t_start}s to t={t_end}s?"
    - "Identify all sensors showing anomalous readings."
    - "What is the most significant anomaly in this episode?"
    
  multiple_choice:
    - template: "Which joint shows abnormal behavior in this episode?"
      options: ['{joint_1}', '{joint_2}', '{joint_3}', 'None']
      answer_method: 'anomaly_detector'
    - template: "What type of anomaly is present in {joint_name}?"
      options: ['Position drift', 'Velocity spike', 'Temperature rise', 'No anomaly']
      answer_method: 'anomaly_classifier'

intervention:
  what_if:
    - "If {parameter_name} is increased from {current_value}{unit} to {new_value}{unit}, what would happen to {output_variable}?"
    - "What would be the effect on {system_component} if we changed {control_parameter} to {value}{unit}?"
    - "If I set the speed to {rpm} RPM, will the {component} operate safely?"
    - "What would happen to the torque if velocity increased by {percentage}%?"
    - "If the load increased to {weight} kg, would {joint_name} remain within limits?"
    - "What would be the temperature after running at {speed}{unit} for {duration} seconds?"
    
  parameter_range:
    - "What is the safe operating range for {parameter_name}?"
    - "At what value of {parameter} does {failure_mode} occur?"
    - "What is the maximum {parameter} before triggering {safety_mechanism}?"
    - "What is the recommended {parameter} range for {operation_mode}?"
    - "At what {parameter} value should I activate cooling?"
    
  comparative:
    - "Would increasing {param_1} or {param_2} have a greater effect on {outcome}?"
    - "Is it safer to reduce {param_1} or increase {param_2} to fix {problem}?"
    - "Which parameter change would most effectively prevent {failure_mode}?"

troubleshooting:
  root_cause:
    - "What could be causing the {symptom} in {component}?"
    - "Why is {sensor_reading} showing {abnormal_value}{unit}?"
    - "What are the top 3 possible causes for {failure_symptom}?"
    - "What parameter deviation is most likely responsible for {fault}?"
    - "Which component is the likely source of {symptom}?"
    - "What mechanical issue could explain {vibration_pattern}?"
    
  remediation:
    - "What parameter adjustments would fix {problem}?"
    - "How can I bring {parameter} back to normal range?"
    - "What should be done to prevent {failure_mode}?"
    - "What is the recommended action for fault code {code}?"
    - "How should I adjust the system to eliminate {symptom}?"
    
  diagnostic:
    - "Which sensor should I check first to diagnose {problem}?"
    - "What additional data would help diagnose {symptom}?"
    - "Is {symptom} indicative of a mechanical or electrical fault?"
    - "What is the severity level of this fault?"

position_velocity:
  state_queries:
    - "What is the current position of {joint_name}?"
    - "What is the velocity of joint {joint_number} at t={timestamp}s?"
    - "What is the acceleration profile of {component} during this episode?"
    - "What is the maximum velocity reached by {joint_name}?"
    - "At what time does {joint_name} change direction?"
    - "What is the average angular velocity of {joint_name} from t={t1}s to t={t2}s?"
    
  load_queries:
    - "What is the estimated weight of the object being gripped?"
    - "How much torque is being applied to joint {joint_number}?"
    - "What is the current load on {actuator_name}?"
    - "What is the maximum torque experienced by {joint_name} in this episode?"
    - "Is the gripper force within safe limits?"
    - "What percentage of maximum load is currently applied?"
    
  trajectory:
    - "Does the trajectory of {joint_name} follow the planned path?"
    - "What is the deviation from the intended position at t={timestamp}s?"
    - "How smooth is the motion of {joint_name} during this episode?"
    - "Are there any unexpected stops in the trajectory?"

operating_ranges:
  limit_queries:
    - "Is {parameter} within the safe operating limits?"
    - "How close is {parameter} to its maximum allowed value?"
    - "What is the safety margin for {parameter}?"
    - "Has {parameter} exceeded its nominal range at any point?"
    
  duration_queries:
    - "For how long has {parameter} been outside normal range?"
    - "How many times does {parameter} exceed limits in this episode?"
    - "What is the longest continuous period of normal operation?"

pattern_detection:
  frequency:
    - "What is the dominant frequency in {sensor_name} data?"
    - "Is there a periodic pattern in {parameter}?"
    - "What is the vibration frequency of {component}?"
    - "Are there any resonance frequencies present?"
    
  trend:
    - "Is {parameter} showing an increasing trend?"
    - "What is the rate of change of {parameter}?"
    - "Is {parameter} stabilizing or diverging?"
    - "What is the long-term trend in {sensor_reading}?"
    
  correlation:
    - "Is there a correlation between {param_1} and {param_2}?"
    - "When {param_1} increases, what happens to {param_2}?"
    - "Are {sensor_1} and {sensor_2} showing synchronized behavior?"
